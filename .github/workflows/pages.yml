name: Build and deploy river platform
on:
  push:
    branches: [master]
    paths: ['web/**', 'scripts/**', 'knowledge/**', 'data/gis/**', 'tests/**', 'package.json', 'api/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.manifest.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .web-cache
          key: river-assets-v2-${{ hashFiles('scripts/build_web.py', 'scripts/ingest_public_manuals.py') }}
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s tests -p test_rag_api.py -v
      - run: npm test
      - name: Index public technical manuals
        run: python scripts/ingest_public_manuals.py
      - name: Build locally served 3D engines and knowledge index
        run: python scripts/build_web.py
      - name: Record reproducible build version
        id: manifest
        run: python -c "import json,os; open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+json.load(open('dist/build.json'))['revision']+'\n')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-public-site:
    needs: [build, deploy]
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest now moves to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Install supported Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Verify the deployed website and engineering model
        run: python tests/browser_smoke.py --url '${{ needs.deploy.outputs.page_url }}' --revision '${{ needs.build.outputs.revision }}' --out browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site-browser-check
          path: browser-results
